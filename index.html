:root{

    --p:#3fbf8c; --p2:#2a9d72; --soft:#173126; --gold:#e0be4a;

}
:root[data-theme="dark"]{

  --p:#3fbf8c; --p2:#2a9d72; --soft:#173126; --gold:#e0be4a;
  --note:#2b2612; --noteb:#4a4020; --notet:#e6d28a; --chip:#233029; --chipt:#cfe0d6;
  --dangerbg:#3a1a18; --danger:#ff8f86;
}

@media (prefers-color-scheme: dark){

html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;

.container{max-width:980px;margin:auto;padding:24px 16px 50px}

header p{margin:0;opacity:.92}
.box{background:var(--card);border-radius:18px;padding:20px;box-shadow:0 8px 30px rgba(0,30,20,.08);border:1px solid var(--line)}
label{font-size:13px;font-weight:700;color:var(--muted);display:block;margin-bottom:6px}
input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-family:inherit;font-size:15px;background:var(--card);color:var(--text)}
.fields{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{border:2px solid var(--line);background:var(--card);color:var(--text);padding:9px 16px;border-radius:999px;font-weight:600;font-size:14px}
.chip.active{border-color:var(--p2);background:var(--soft);color:var(--p)}
.actions{display:flex;gap:10px;margin-top:14px}
button{border:0;border-radius:10px;padding:12px 18px;cursor:pointer;font-family:inherit;font-size:15px;font-weight:700}
.chip{cursor:pointer;font-family:inherit}
.primary{background:var(--p);color:#fff;flex:1}
:root[data-theme="dark"] .primary{color:#06130d}
.secondary{background:var(--chip);color:var(--chipt)}
.summary{margin:24px 0 12px;font-weight:800}
.results{display:grid;gap:12px}
.day{font-weight:800;color:var(--p);margin:10px 0 0;font-size:15px}
.card{background:var(--card);border-radius:16px;padding:18px;border:1px solid var(--line);box-shadow:0 5px 18px rgba(0,30,20,.05)}
.top{display:flex;gap:14px;align-items:flex-start}
.time{flex:none;min-width:84px;text-align:center;background:var(--soft);color:var(--p);border-radius:12px;padding:10px 8px;font-weight:700}
.time b{display:block;font-size:22px;line-height:1.2}
.time small{font-size:12px;font-weight:600}
.info{flex:1;min-width:0}
.title{font-size:20px;font-weight:700;line-height:1.5}
.th{color:var(--muted);font-size:14px;margin-top:2px}
.meta{color:var(--muted);margin-top:8px;line-height:1.8}
.meta .ar{color:var(--text)}
.badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:800;background:var(--soft);color:var(--p);margin-top:8px}
.badge.cancel{background:var(--dangerbg);color:var(--danger)}
.badge.reg{background:var(--note);color:var(--notet)}
.note{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--note);border:1px solid var(--noteb);font-size:14px;line-height:1.7;color:var(--notet)}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
a.btn{flex:1;min-width:120px;text-align:center;text-decoration:none;padding:12px 14px;border-radius:10px;font-weight:700;background:var(--chip);color:var(--text)}
a.btn.main{background:#1f9d57;color:#fff}
.empty{text-align:center;padding:35px 15px;color:var(--muted);background:var(--card);border-radius:16px}
.notice{margin-top:20px;font-size:12px;line-height:1.7;color:var(--muted);background:var(--note);border:1px solid var(--noteb);padding:13px;border-radius:12px}
.notice a{color:inherit}
@media(max-width:700px){.fields{grid-template-columns:1fr}h1{font-size:23px}.top{flex-direction:column}.time{width:100%;display:flex;justify-content:center;gap:8px;align-items:baseline}.time b{display:inline}}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab{flex:1;background:var(--card);color:var(--text);border:2px solid var(--line);border-radius:12px;padding:12px}
.tab.active{border-color:var(--p2);background:var(--soft);color:var(--p)}
.cat{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden}
.cat summary{cursor:pointer;padding:16px 18px;font-weight:700;font-size:17px;list-style:none}
.cat summary::-webkit-details-marker{display:none}
.cat summary small{display:block;color:var(--muted);font-weight:400;font-size:13px;margin-top:2px}
.cat[open] summary{border-bottom:1px solid var(--line)}
.steps{padding:12px 18px 18px;margin:0;list-style:none;counter-reset:s}
.step{position:relative;padding:10px 46px 10px 0;counter-increment:s}
.step::before{content:counter(s);position:absolute;right:0;top:12px;width:32px;height:32px;border-radius:50%;
  background:var(--p);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
:root[data-theme="dark"] .step::before{color:#06130d}
.step:not(:last-child)::after{content:"";position:absolute;right:15px;top:46px;bottom:-10px;width:2px;background:var(--line)}
.step .ar{font-size:17px;font-weight:600}
.step .thn{color:var(--muted);font-size:14px}
.lv{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--chipt);margin-inline-start:6px}
.find{margin-top:6px;font-size:13px;padding:6px 12px;background:var(--soft);color:var(--p)}
.sub{font-weight:700;font-size:13px;color:var(--muted);margin:14px 0 4px}
.plain{margin:0;padding:0 18px 0 0;line-height:2}
.plain .n{color:var(--muted);font-size:13px}

/* ปรับตัวอักษรอาหรับให้ค้นหาเจอ */
function norm(s){
  return String(s||"").toLowerCase()
    .replace(/[\u064B-\u065F\u0670\u0640]/g,"")
    .replace(/[أإآٱ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه")
    .replace(/ؤ/g,"و").replace(/ئ/g,"ي").replace(/\s+/g," ").trim();
}

function todayStr(offset=0){
  const d = new Date(Date.now()+offset*864e5);
  return new Intl.DateTimeFormat("en-CA",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit"}).format(d);
}
function fmtDate(d){
  return new Date(d+"T00:00:00").toLocaleDateString("th-TH",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
}
function slotOf(t){
  const s = String(t);
  if (/الفجر|الضحى|الشروق/.test(s)) return "morning";
  if (/الظهر|ظهر|الجمعة/.test(s)) return "noon";
  if (/العصر|المغرب|مغرب|العشاء/.test(s)) return "after";
  const h = parseInt(s.split(":")[0],10);
  return isNaN(h) ? "after" : h < 12 ? "morning" : h < 15 ? "noon" : "after";
}

const SLOT_TH = {morning:"ช่วงเช้า", noon:"ซุฮร์", after:"บ่าย/เย็น"};
const WEEKS_AHEAD = 8;
function addDays(d,n){
  const x = new Date(d+"T00:00:00Z");
  x.setUTCDate(x.getUTCDate()+n);
  return x.toISOString().slice(0,10);
}
const DST_END = "2026-10-30"; // วันแรกที่อียิปต์ใช้เวลาฤดูหนาว

const minusHour = t => {
  if (!/^\d{1,2}:\d{2}$/.test(t)) return t;
  const [h,m] = t.split(":").map(Number);
  return String((h+23)%24).padStart(2,"0") + ":" + String(m).padStart(2,"0");
};

function expand(list){
  const today = todayStr(), horizon = addDays(today, WEEKS_AHEAD*7), out = [];
  list.forEach(c=>{
    if (isReg(c) || c.once || isFinal(c)){ out.push(c); return; }
    const skip = c.skip || [];
    for (let d=c.date; d<=horizon; d=addDays(d,7)){
      if (c.until && d>c.until) break;
      if (d<today) continue;
      const time = (c.prayer && c.date < DST_END && d >= DST_END) ? minusHour(c.time) : c.time;
      out.push({...c, date:d, time, status: skip.includes(d) ? "cancelled" : c.status});
    }
  });
  return out;
}

const TIME_ORDER = t => {
  const s = String(t);
  if (/^\d/.test(s)) return s.padStart(5,"0");
  if (/الفجر/.test(s)) return "05:00";
  if (/الضحى/.test(s)) return "09:00";
  if (/الظهر|ظهر|الجمعة/.test(s)) return "12:30";
  if (/العصر/.test(s)) return "15:30";
  if (/المغرب|مغرب/.test(s)) return "18:00";
  if (/العشاء/.test(s)) return "19:30";
  return "99:99";
};

      <div class="meta">
        🎙️ <span class="ar" dir="auto">${esc(c.teacher)}</span>${c.teacherTh?` <span>(${esc(c.teacherTh)})</span>`:""}<br>
        📍 <span class="ar" dir="auto">${esc(v.ar || v.en || "")}</span>${v.ar && v.en ? ` <span>(${esc(v.en)})</span>` : ""}${v.th?` <span>(${esc(v.th)})</span>`:""}
      </div>
            ${c.subject?c.subject.split(/[,،]/).map(s=>`<span class="badge" dir="auto">🏷️ ${esc(s.trim())}</span> `).join(""):""}
      ${cancelled?`<span class="badge cancel">❌ ยกเลิก</span>`:moved?`<span class="badge cancel">🔁 เลื่อน/เปลี่ยนแปลง</span>`:isReg(c)?`<span class="badge reg">📝 ต้องลงทะเบียน</span>`:`<span class="badge">✅ دعوة عامة للجميع</span>`}
    </div>
  </div>
  ${c.note?`<div class="note">📝 <span dir="auto">${esc(c.note)}</span>${c.noteTh?`<br>${esc(c.noteTh)}`:""}</div>`:""}
  <div class="row">
        ${v.map?`<a class="btn" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(v.map)}" target="_blank" rel="noopener noreferrer">🗺️ แผนที่</a>`:""}
    ${c.source?`<a class="btn" href="${esc(c.source)}" target="_blank" rel="noopener noreferrer">🔗 โพสต์ต้นฉบับ</a>`:""}
    </div>
</article>`;
  });
  out.innerHTML = html;
}

function resetAll(){
  $("q").value=""; $("slot").value="all"; $("venue").value="all"; $("teacher").value="all"; $("access").value="all";
  $("weekday").value="all"; $("date").value="";$("subject").value="all";
  dayMode="week";
  syncChips();
  search();
}

function switchView(v){
  $("viewSchedule").hidden = v!=="schedule";
  $("viewMethod").hidden = v!=="method";
  document.querySelectorAll("#tabs .tab").forEach(t=>{
  const on = t.dataset.view===v;
  t.classList.toggle("active", on);
  t.setAttribute("aria-selected", on);
});
  window.scrollTo({top:0});
}
document.querySelectorAll("#tabs .tab").forEach(t=>t.addEventListener("click",()=>switchView(t.dataset.view)));
$("methodList").addEventListener("click",e=>{
  const b = e.target.closest(".find"); if(!b) return;
  resetAll();
  $("q").value = b.dataset.q;
  switchView("schedule");
  search();
});
renderMethod();
syncChips();
search();
</script>
</body>
</html>
