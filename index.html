/* ปรับตัวอักษรอาหรับให้ค้นหาเจอ */
function norm(s){
  return String(s||"").toLowerCase()
    .replace(/[\u064B-\u065F\u0670\u0640]/g,"")
    .replace(/[أإآٱ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه")
    .replace(/ؤ/g,"و").replace(/ئ/g,"ي").replace(/\s+/g," ").trim();
}

function todayStr(offset=0){
  const d = new Date(Date.now()+offset*864e5);
  return new Intl.DateTimeFormat("en-CA",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit"}).format(d);
}
function fmtDate(d){
  return new Date(d+"T00:00:00").toLocaleDateString("th-TH",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
}
function slotOf(t){
  const s = String(t);
  if (/الفجر|الضحى/.test(s)) return "morning";
  if (/الظهر/.test(s)) return "noon";
  if (/العصر|المغرب|العشاء/.test(s)) return "after";
  const h = parseInt(s.split(":")[0],10);
  return isNaN(h) ? "after" : h < 12 ? "morning" : h < 15 ? "noon" : "after";
}

const SLOT_TH = {morning:"ช่วงเช้า", noon:"ซุฮร์", after:"บ่าย/เย็น"};
const WEEKS_AHEAD = 8;
function addDays(d,n){
  const x = new Date(d+"T00:00:00Z");
  x.setUTCDate(x.getUTCDate()+n);
  return x.toISOString().slice(0,10);
}
const DST_END = "2026-10-30"; // วันแรกที่อียิปต์ใช้เวลาฤดูหนาว

const minusHour = t => {
  if (!/^\d{1,2}:\d{2}$/.test(t)) return t;
  const [h,m] = t.split(":").map(Number);
  return String((h+23)%24).padStart(2,"0") + ":" + String(m).padStart(2,"0");
};

function expand(list){
  const today = todayStr(), horizon = addDays(today, WEEKS_AHEAD*7), out = [];
  list.forEach(c=>{
    if (isReg(c) || c.once || isFinal(c)){ out.push(c); return; }
    const skip = c.skip || [];
    for (let d=c.date; d<=horizon; d=addDays(d,7)){
      if (c.until && d>c.until) break;
      if (d<today) continue;
      const time = (c.prayer && c.date < DST_END && d >= DST_END) ? minusHour(c.time) : c.time;
      out.push({...c, date:d, time, status: skip.includes(d) ? "cancelled" : c.status});
    }
  });
  return out;
}

const nm = x => typeof x==="string" ? {ar:x} : x;
const qOf = b => b.q || b.ar.replace(/\(.*?\)/g,"").replace(/^(شرح|حاشية)\s+/,"").trim().split(/\s+/).slice(0,2).join(" ");
const li = (b,num) => `
    <li class="${num?"step":""}">
      <div class="ar" dir="auto">${esc(b.ar)}${b.lv?`<span class="lv">${esc(b.lv)}</span>`:""}</div>
      ${b.note?`<div class="thn">${esc(b.note)}</div>`:""}
      <button class="find" data-q="${esc(qOf(b))}">🔍 ดูในตารางเรียน</button>
    </li>`;
const plain = a => `<ul class="plain">${a.map(x=>{const b=nm(x);return `<li dir="auto">${esc(b.ar)}${b.note?` <span class="n">(${esc(b.note)})</span>`:""}</li>`}).join("")}</ul>`;

function renderMethod(){
  $("methodList").innerHTML = METHOD.map((m,i)=>`
<details class="cat"${i===0?" open":""}>
  <summary>${m.icon} <span dir="auto">${esc(m.cat)}</span> — ${esc(m.th)}
    <small>${m.b.length?m.b.length+" เล่มตามลำดับ":""}${m.m.length?` · ท่องจำ ${m.m.length}`:""}${m.r.length?` · อ่านเสริม ${m.r.length}`:""}</small></summary>
  <div style="padding:12px 18px 18px">
    ${m.b.length?`<ol class="steps" style="padding:0">${m.b.map(b=>li(b,true)).join("")}</ol>`:""}
    ${m.m.length?`<div class="sub">📌 متون للحفظ (ท่องจำ)</div>${plain(m.m)}`:""}
    ${m.r.length?`<div class="sub">📚 للمطالعة (อ่านเสริม)</div>${plain(m.r)}`:""}
  </div>
</details>`).join("");
}

const TIME_ORDER = t => {
  const s = String(t);
  if (/^\d/.test(s)) return s.padStart(5,"0");
  if (/الفجر/.test(s)) return "05:00";
  if (/الضحى/.test(s)) return "09:00";
  if (/الظهر/.test(s)) return "12:30";
  if (/العصر/.test(s)) return "15:30";
  if (/المغرب/.test(s)) return "18:00";
  if (/العشاء/.test(s)) return "19:30";
  return "99:99";
};

function search(){
  const today = todayStr(), q = norm($("q").value);
  const slot = $("slot").value, venue = $("venue").value, teacher = $("teacher").value;
  const access = $("access").value;
  const subject = $("subject").value;  
  const weekday = $("weekday").value, dateVal = $("date").value;

    let data = expand(classes).filter(c => c.date >= today);
  if (dateVal) data = data.filter(c=>c.date===dateVal);
  else if (dayMode==="today") data = data.filter(c=>c.date===today);
    else if (dayMode==="tomorrow") data = data.filter(c=>c.date===todayStr(1));
  else if (dayMode==="week") data = data.filter(c=>c.date<=todayStr(6));
    if (weekday!=="all") data = data.filter(c=>String(dowOf(c.date))===weekday);

  if (slot!=="all") data = data.filter(c=>slotOf(c.time)===slot);
  if (venue!=="all") data = data.filter(c=>c.venue===venue);
  if (teacher!=="all") data = data.filter(c=>c.teacher===teacher);
  if (subject!=="all") data = data.filter(c =>
  String(c.subject||"").split(/[,،]/).map(s=>s.trim()).includes(subject));
  if (access==="open") data = data.filter(c=>!isReg(c));
  if (access==="reg") data = data.filter(isReg);
  
  if (q){
    data = data.filter(c=>{
            const hay = norm([c.title,c.teacher,c.note,c.alias,c.subject,
        VENUES[c.venue]?.ar].join(" "));
      return q.split(" ").every(w=>hay.includes(w));
    });
  }
data.sort((a,b)=>a.date.localeCompare(b.date)||TIME_ORDER(a.time).localeCompare(TIME_ORDER(b.time)));
  $("summary").textContent = `พบ ${data.length} คาบเรียน`;
  const out = $("results");
  if(!data.length){
    out.innerHTML = `<div class="empty">ยังไม่พบคาบเรียนที่ตรงกับการค้นหา<br><br>ลองเปลี่ยนคำค้น หรือเลือก “ทั้งหมด”</div>`;
    return;
  }
  let last = "", html = "";
  data.forEach(c=>{
    if(c.date!==last){ last=c.date; html += `<div class="day">🗓️ ${fmtDate(c.date)}${c.date===today?" · วันนี้":""}</div>`; }
    const v = VENUES[c.venue] || {ar:"",th:""};
    const cancelled = c.status==="cancelled", moved = c.status==="moved";
    html += `
<article class="card">
  <div class="top">
    <div class="time"><b>${esc(c.time)}</b><small>${SLOT_TH[slotOf(c.time)]}</small></div>
    <div class="info">
      <div class="title" dir="auto">📖 ${esc(c.title)}</div>
      ${c.titleTh?`<div class="th">${esc(c.titleTh)}</div>`:""}
      <div class="meta">
        🎙️ <span class="ar" dir="auto">${esc(c.teacher)}</span>${c.teacherTh?` <span>(${esc(c.teacherTh)})</span>`:""}<br>
        📍 <span class="ar" dir="auto">${esc(v.ar || v.en || "")}</span>${v.ar && v.en ? ` <span>(${esc(v.en)})</span>` : ""}${v.th?` <span>(${esc(v.th)})</span>`:""}
      </div>
            ${c.subject?c.subject.split(/[,،]/).map(s=>`<span class="badge" dir="auto">🏷️ ${esc(s.trim())}</span> `).join(""):""}
      ${cancelled?`<span class="badge cancel">❌ ยกเลิก</span>`:moved?`<span class="badge cancel">🔁 เลื่อน/เปลี่ยนแปลง</span>`:isReg(c)?`<span class="badge reg">📝 ต้องลงทะเบียน</span>`:`<span class="badge">✅ دعوة عامة للجميع</span>`}
    </div>
  </div>
  ${c.note?`<div class="note">📝 <span dir="auto">${esc(c.note)}</span>${c.noteTh?`<br>${esc(c.noteTh)}`:""}</div>`:""}
  <div class="row">
        ${v.map?`<a class="btn" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(v.map)}" target="_blank" rel="noopener noreferrer">🗺️ แผนที่</a>`:""}
    ${c.source?`<a class="btn" href="${esc(c.source)}" target="_blank" rel="noopener noreferrer">🔗 โพสต์ต้นฉบับ</a>`:""}
    </div>
</article>`;
  });
  out.innerHTML = html;
}

function resetAll(){
  $("q").value=""; $("slot").value="all"; $("venue").value="all"; $("teacher").value="all"; $("access").value="all";
  $("weekday").value="all"; $("date").value="";$("subject").value="all";
  dayMode="all";
  syncChips();
  search();
}

function switchView(v){
  $("viewSchedule").hidden = v!=="schedule";
  $("viewMethod").hidden = v!=="method";
  document.querySelectorAll("#tabs .tab").forEach(t=>t.classList.toggle("active",t.dataset.view===v));
  window.scrollTo({top:0});
}
document.querySelectorAll("#tabs .tab").forEach(t=>t.addEventListener("click",()=>switchView(t.dataset.view)));
$("methodList").addEventListener("click",e=>{
  const b = e.target.closest(".find"); if(!b) return;
  resetAll();
  $("q").value = b.dataset.q;
  switchView("schedule");
  search();
});
renderMethod();
search();
</script>
